version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  beat:
    build: .
    command: celery -A academia_builder beat -l info
    volumes:
      - .:/app
    depends_on:
      - redis
    env_file:
      - .env.local

  worker:
    build: .
    command: celery -A academia_builder worker -l info
    volumes:
      - .:/app
    depends_on:
      - redis
    env_file:
      - .env.local

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    depends_on:
      - redis
      - beat
      - worker